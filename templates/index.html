<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduGenie - AI Study Buddy</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4ff; margin: 0; padding: 20px; }
        .container { max-width: 800px; margin: 0 auto; background: white; border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #4f46e5; }
        h1 span { color: #06b6d4; }
        .tagline { text-align: center; color: #666; margin-bottom: 30px; }
        textarea { width: 100%; height: 120px; padding: 15px; border: 2px solid #e0e7ff; border-radius: 10px; font-size: 16px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #4f46e5; color: white; border: none; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        button:hover { background: #4338ca; }
        #answer { margin-top: 25px; padding: 20px; background: #f8fafc; border-radius: 10px; border-left: 5px solid #4f46e5; display: none; white-space: pre-wrap; line-height: 1.6; }
        .footer { text-align: center; margin-top: 20px; color: #999; font-size: 12px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Edu<span>Genie</span> 🧞‍♂️</h1>
        <p class="tagline">Unakku Pudicha AI Study Buddy - Doubt ah Kelu!</p>
        
        <form id="askForm">
            <textarea id="question" name="question" placeholder="Enna doubt da? Eg: Explain photosynthesis in simple Tamil..."></textarea>
            <button type="submit">Ask Genie ✨</button>
        </form>

        <div id="answer"></div>
        <div class="footer">Built for SkillWallet Hackathon</div>
    </div>

    <script>
        const form = document.getElementById('askForm');
        const answerDiv = document.getElementById('answer');
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const q = document.getElementById('question').value;
            if(!q) return;
            answerDiv.style.display = 'block';
            answerDiv.innerHTML = 'Genie yosikuthu... 🤔';
            try {
                const res = await fetch('/ask', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({question: q})
                });
                const data = await res.json();
                answerDiv.innerHTML = data.answer || data.response || 'Error da, thirumba try pannu!';
            } catch (err) {
                // fallback if main.py uses form-data
                const formData = new FormData();
                formData.append('question', q);
                try {
                    const res2 = await fetch('/chat', { method: 'POST', body: formData });
                    const data2 = await res2.json();
                    answerDiv.innerHTML = data2.answer || 'Done da!';
                } catch(e2){
                    answerDiv.innerHTML = 'Server connect aagala da! main.py check pannu!';
                }
            }
        });
    </script>
</body>
</html>
